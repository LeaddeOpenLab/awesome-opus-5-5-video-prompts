name: Deploy Fable showcase to the original Pages URL
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Fable showcase and source data
        uses: actions/checkout@v4
        with:
          repository: LeaddeOpenLab/awesome-fable-5.2-video-prompts
          ref: main
          path: fable-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static pages
        env:
          SITE_URL: https://leaddeopenlab.github.io/awesome-opus-5-5-video-prompts/
          GA_MEASUREMENT_ID: G-EWWVH9CVTM
        run: python3 fable-source/site/build.py
      - name: Check pages and local links
        run: python3 fable-source/site/check.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fable-source/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
