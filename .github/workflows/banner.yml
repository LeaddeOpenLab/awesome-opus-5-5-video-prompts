name: Refresh README banner
on:
  push:
    branches: [main]
    paths:
      - data/library/**
      - data/categories/**
      - data/pro-tip-overrides.json
      - prompts/**
      - README.md
      - .github/scripts/update-pro-tips.py
      - .github/scripts/update-banner.py
      - .github/scripts/update-template-cards.py
      - .github/readme-template-cards.md
      - .github/workflows/banner.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: readme-banner
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Keep runnable template cards
        run: python3 .github/scripts/update-template-cards.py
      - name: Render banner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update-banner.py
      - name: Add case Pro Tips
        run: python3 .github/scripts/update-pro-tips.py
      - name: Save banner and case tips
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/banner*.svg prompts/*.md data/categories/*.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh banner and case Pro Tips [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
